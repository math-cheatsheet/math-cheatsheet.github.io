<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Pages Site</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #58a6ff;
            margin-top: 0;
        }
        p {
            color: #8b949e;
            line-height: 1.5;
        }
        .badge {
            display: inline-block;
            background-color: #238636;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
            margin-top: 15px;
        }
        .badge:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 It Works!</h1>
        <p>Your GitHub Pages site is live and hosting successfully. You can now replace this file with your own portfolio or project.</p>
        <a class="badge" href="https://github.com" target="_blank">View GitHub</a>
    </div>
</body>
</html>
